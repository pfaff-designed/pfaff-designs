  role: "Design Engineer / Applied AI Technologist"
  year: "2024–2025"
  one_liner: "Pfaff.design is a portfolio built to solve a familiar problem. The work I do sits between UX, engineering, and applied AI, but those layers are hard to show in a traditional format. This site pairs a clear narrative with an embedded agent that lets people explore the reasoning, structure, and technical detail beneath the surface."

context: |
  Every portfolio tells a story, but a lot of the real work happens underneath it.

  The research, the choices, and the systems that hold everything together rarely fit inside a clean set of screenshots.

  I wanted to build a portfolio that did not hide that part of the work. Something where the surface stayed simple to read, and the structure underneath was still available for anyone who wanted to explore it.

  Pfaff.design became the place to try that.

problem: |
  The idea for the site grew out of a simple question: how do you let people read the story while still giving them access to everything underneath it?

  I knew the portfolio needed to work for different kinds of readers. Some people want a quick overview. Others want the details. A few want the technical depth. I wanted the site to support all of those paths without turning into something confusing or slow.

solution: |
  That is why the foundation is a static site. It keeps the experience fast and familiar, and it lets the case studies stay focused on clear narrative. On top of that, the site includes an embedded agent that can answer questions, surface extra context, and reveal the deeper structure when someone wants it.

  It created a balance I had not seen in a traditional portfolio. You can skim the work like any normal site, or you can treat it like a conversation and follow the threads that matter to you.

process: |
  I started with planning, research, and a long list of questions about how a generative front end should behave. I explored a version of the site that was fully generative. Every answer came from the model, and every layout was created on the fly. The prototype worked, but it also revealed a problem. Generative interfaces are interesting when people want to spend time with them, but a portfolio needs to get information across quickly.

  That is what pushed the project in a different direction. I shifted to a static site that holds the primary narrative and built a structured system underneath it. The content lives in a knowledge base written in YAML and JSON, which are simple text-based formats for organizing information. They let me define the important pieces of each project in a way that is easy for both humans and the agent to understand.

  Once that content layer was in place, I added intent routing, schemas, and a small orchestration layer. The agent can figure out when to give a quick answer, when to generate a structured layout, or when to offer a deeper dive. It also knows what it should not invent.

  Most of the work in this phase happened quietly in the background. Designing schemas, testing prompts, rewriting pathways, and building guardrails so the system stayed predictable. The goal was not to automate the site. The goal was to create something that felt steady and conversational at the same time.

outcomes: |
  The finished site does two things at once. It tells a clear story about the work, and it also gives people a way to explore the structure behind it. Most portfolios flatten that distinction. This one makes space for both.

  The static pages give readers the overview they expect, and the embedded agent lets them go deeper when they want to understand how something was built, why certain decisions were made, or what tools and processes shaped the project. That mix feels closer to how I work in real life.

reflections: |
  The build taught me a lot about working with AI in a controlled way. The constraints, the schemas, and the routing logic matter as much as the model itself. The most interesting parts of the project were not the flashy features, but the small structural choices that made the system predictable and easy to reason about.

  In the end, Pfaff.design became more than a portfolio. It became a place to test ideas about clarity, interaction, and AI-assisted systems. It reflects how I think, how I solve problems, and how I like to work with technology. And it leaves room for future versions of the site to become even more adaptive.

