project:
  client: "Project Management Institute"
  title: "PMI Website Redesign"
  role: "Front-End Engineer"
  year: "2022"
  one_liner: "Built components and refined patterns for PMI’s redesigned certification experience using a structured design system and Radix UI primitives."

context: |
  PMI was undergoing a brand refresh and a redesign of the user experience for people pursuing certifications. The existing site was functional but inconsistent, and the new direction required an interface that was clearer, more cohesive, and easier to navigate.

  To support this, the team invested in a well-structured component library built on design tokens and predictable patterns. The goal was to create a system that could scale across complex content while staying consistent and easy to maintain.

problem: |
  The certification platform supports a large, global audience, and the content spans many formats and flows. The system needed to:
  - Present complex information clearly
  - Create visual and behavioral consistency across pages
  - Translate detailed design tokens into reliable front-end patterns
  - Support a structured, scalable component library

  The challenge was to bring a carefully defined design system into code while keeping the components flexible enough to work across multiple layouts.

solution: |
  My contribution centered on implementing components with Radix UI primitives and shaping them to reflect PMI’s detailed design system. I worked from precise Figma specs and used design tokens to build components that behaved consistently across the site.

  I collaborated closely with the PMI designer, PM, and senior engineer to refine interactions and make sure the system reflected the intended patterns. I also introduced a PR checklist template that helped improve the consistency and clarity of code reviews.

process: |
  **1. Component Development**  
  Built new components and refined existing patterns using Radix primitives. Ensured alignment between Figma specifications, design tokens, and front-end behavior.

  **2. UI Refinement**  
  Worked with design to polish spacing, interactions, and visual details so that the components matched the intended experience.

  **3. Bug Fixing and QA**  
  Addressed UI issues and verified consistent behavior across multiple content states. Participated in QA and design reviews to support the stability of the system.

  **4. System Alignment**  
  Helped maintain a clear and predictable component library by following established patterns and reinforcing organized workflows. Created a PR checklist that supported consistent reviews across the team.

outcomes: |
  The redesign delivered a clearer and more cohesive experience for PMI’s global certification audience. The structured component library created a stable foundation that could support future growth and evolving content needs.

  This project shaped how I think about front-end engineering. It taught me how strong systems are built, how to translate design tokens into code, and how clarity in process leads to clarity in the final product.

reflections: |
  PMI was one of the best organized and best structured projects I worked on early in my career. It showed me what it looks like when a design system is treated as a product, and it taught me how to work inside a clear, well-considered framework. Those lessons continue to influence how I approach front-end development and system design.

