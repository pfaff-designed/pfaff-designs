project:
  id: "pmi-agile-certification"
  title: "PMI Agile Certification Site"
  client: "PMI (Project Management Institute)"
  industry: "Professional Certification, Education"
  role: "Front-End Engineer / Technologist"
  one_liner: "Built a modern, responsive front-end for PMI's Agile certification site to clarify the value and make the path to certification easier to follow."

context: |
  PMI is a globally recognized organization in the project management and agile certification space. They needed a refreshed site for their Agile Certified Practitioner (ACP) program—one that clearly communicated the value of the certification and felt modern, trustworthy, and easy to navigate.

  Delivered through AKQA, the project required close collaboration across design, engineering, and project management. My role focused on front-end engineering and design translation, turning detailed Figma files into reliable, responsive components that worked cleanly across devices and accessibility requirements.

problem: |
  The existing ACP page felt dated and text-heavy. Key benefits and requirements were hard to skim, the value proposition wasn’t immediately clear, and the experience didn’t adapt well to mobile. PMI needed a structure that made information easier to understand while aligning with their evolving brand.

solution: |
  I built a modern, responsive front-end using React, TypeScript, and Tailwind. Working from Figma, I translated the visual direction into accessible components that emphasized clarity, hierarchy, and readability. The updated structure made it easier for users to understand the certification at a glance while still offering depth where needed.

process: |
  I reviewed the design concepts with the creative team to clarify interaction details and ensure the structure would hold across all breakpoints. From there, I developed modular components with predictable state handling and strong accessibility support.

  Throughout the build, I refined spacing, hierarchy, and layout in partnership with designers, and worked with back-end engineers to integrate dynamic content. I tested components across multiple devices to ensure the experience remained consistent and trustworthy.

outcomes: |
  The refreshed ACP page improved clarity around PMI’s Agile certification and delivered a modern, responsive experience. The components were structured for reuse, making future updates easier, and the final build aligned strongly with PMI’s brand and accessibility standards. Users could understand the certification more quickly and navigate the information with greater confidence.

reflections: |
  This project reinforced the value of tight design–engineering collaboration. Working closely with designers helped ensure the final build expressed the intended visual language without unnecessary complexity. It also strengthened my practice of creating accessible, readable interfaces for content-heavy pages.

