project:
  id: "capital-one-travel"
  title: "Capital One"
  client: "Capital One"
  industry: "Financial Services, Travel"
  role: "Front-End Engineer"
  one_liner: "I worked on Capital One Travel across several phases of the product, contributing to components and pages that needed to support new content and new priorities as the platform grew. One ongoing challenge was expanding the site as Capital One opened new airport lounges. My work focused on building templates and components that made it possible to roll out new lounge pages without reinventing the structure each time. The goal was to create UI that felt cohesive, stable, and simple to extend as new locations launched."

context: |
  Capital One Travel evolved through many short development cycles, often with different teams contributing at different times. My work happened inside that environment across several iterations of the product. The lounge expansion was one example, but the larger effort was about building new pieces that fit naturally within the system that was already in place.

  When new lounges opened, each page needed its own content and layout, but it also had to feel like part of the same experience. The challenge was working within the patterns that existed while strengthening the areas where the system had started to drift.

  My role was to build components and layouts that could support the platform as it expanded. Sometimes that meant shaping new pages for lounge launches. Other times it meant refining existing patterns so future contributors could work more smoothly. Across the different iterations I worked on, the through-line was the same. I needed to understand how the system behaved, which parts were reliable, and where updates would make the experience more consistent.

  The work was not about producing large, complex features. It was about making thoughtful adjustments to the interface so new additions felt natural, and so the system became a little easier to work with over time.

problem: |
  The site needed scalable templates and consistent UI patterns to support new content, including airport lounge launches, without increasing system fragmentation. Existing components were not always consistent, and new work often introduced additional variations.

process: |
  Each cycle of work began with reading the existing system. The product had gone through many updates, so the first step was understanding which patterns were still solid and which ones had started to drift. I spent time tracing components, checking how they behaved across the site, and identifying the inconsistencies that caused friction for design, QA, and engineering.

  Rather than rebuilding everything, I looked for ways to use the structure that was already there. When launching a new lounge page, the question was how to build it so it fit the system and would not create more complexity for the next launch. This often meant adjusting layout primitives, tightening spacing rules, or reusing established interactions so the new work felt native to the interface.

  Across the different iterations, the approach stayed consistent. Smooth the rough edges, strengthen the reusable pieces, and leave the system more predictable than it was before.

solution: |
  I built page templates and front-end components that supported new lounge launches and other content updates. The work focused on strengthening the system rather than replacing it. I used existing patterns when they were reliable and refined spacing, layout behavior, and interaction rules when those patterns needed clarity.

  The goal was to create additions that felt native to the interface while improving predictability for teams who would work on the site later.

outcomes: |
  The work made the site easier to update as new lounges and new content rolled out. The templates and components we put in place reduced the amount of one-off development needed for each launch, and the interface began behaving more consistently across different pages.

  Small improvements added up. Aligning spacing rules reduced design and engineering drift. Reusing interaction patterns gave QA fewer variations to track. Cleaning up older components made the system more predictable for anyone working in it later.

  Over time, the experience became steadier. New additions fit more naturally, and the product handled expansion without creating extra friction for the teams involved.

reflections: |
  Working on Capital One Travel gave me a clearer sense of how much the small engineering decisions shape the long-term health of a product. Details like how a layout scales, how a component handles edge cases, or how patterns stay aligned across pages can determine whether a system grows smoothly or becomes harder to maintain. When those details are handled well, people do not think about them. The experience simply works.

  This project helped me understand the value of building with the future in mind. It showed me how much I care about creating systems that stay stable as a product grows.

