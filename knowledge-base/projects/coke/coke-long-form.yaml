project_facts: |
  [PROJECT_FACTS]
  
  Client: Coca-Cola
  
  Project: Applied AI & Creative Technology Initiatives
  
  Role: Creative Technologist / Applied AI Researcher
  
  Summary: Charles worked with Coca-Cola on a series of applied AI and creative technology initiatives, exploring how generative models and intelligent tools could support brand storytelling, internal workflows, and new digital experiences. His work focused on turning abstract AI capabilities into tangible prototypes that were understandable and usable by non-technical teams.
  
  Team: Brand/creative teams, strategy, engineering partners, and innovation stakeholders.

role: |
  [ROLE]
  
  Charles's role at Coca-Cola sat at the intersection of creative direction and technical implementation. He acted as a bridge between AI research and brand/creative teams, helping translate emerging AI capabilities into concrete concepts, prototypes, and tools. Rather than shipping a single consumer-facing product, his work centered on exploring what was possible, rapidly prototyping ideas, and helping the organization understand how generative AI could show up in their ecosystem.

context: |
  Coca-Cola wanted to understand how emerging AI capabilities could support their creative, brand, and strategic operations. Rather than a single product launch, the organization needed a way to evaluate different AI applications, understand their constraints, and build internal knowledge about what was feasible and valuable.

problem: |
  Moving from abstract conversations about "AI" to concrete, evaluable experiments was challenging. The team needed prototypes that demonstrated real value, clear explanations of technical constraints, and a framework for understanding how AI could support—not replace—creative workflows.

process: |
  [PROCESS]
  
  - Collaborated with creative and strategy partners to identify high-leverage use cases for applied AI (e.g., content exploration, internal tooling, and concept development).
  
  - Evaluated capabilities and tradeoffs of different AI models and tooling approaches, focusing on what would be reliable and explainable in practice.
  
  - Built prototypes and internal demos that showed how AI could support creative workflows, rather than replace them.
  
  - Framed complex technical concepts in accessible language so cross-functional partners could confidently contribute feedback and direction.

tools: |
  [TOOLS]
  
  - Prototyping stack: React, TypeScript, Node.js
  
  - AI and experimentation: modern LLMs and generative tools (text and image), API-driven prototypes
  
  - Collaboration and design: Figma, shared documentation, and demo environments for stakeholder review

impact: |
  [IMPACT]
  
  Charles helped Coca-Cola move from abstract conversations about "AI" to concrete, evaluable experiments. By building prototypes and framing their capabilities clearly, he enabled stakeholders to:
  
  - See how AI might support real creative and strategic workflows.
  
  - Understand constraints and risks, instead of treating AI as a vague magic box.
  
  - Make more grounded decisions about which directions were worth pursuing and which should be deprioritized.
  
  
  
  Rather than a single launch, the impact of this work was a clearer internal language and mental model for applied AI at Coca-Cola, plus a set of prototypes and patterns that future teams could learn from or build on.

collaboration: |
  [COLLABORATION]
  
  Across the Coca-Cola work, Charles collaborated closely with:
  
  - Creative and brand teams, to ensure prototypes reflected real storytelling and campaign needs.
  
  - Strategy and innovation partners, to align AI explorations with broader business questions.
  
  - Technical partners, where needed, to sanity-check feasibility and think through how prototypes might scale if they moved beyond experimentation.
  
  
  
  In all cases, his focus was on making AI feel concrete, explainable, and genuinely useful to the people who would eventually rely on it.

reflections: |
  This work demonstrated the value of acting as a bridge between technical capabilities and creative applications. Rather than focusing on a single deliverable, the project succeeded by building organizational understanding and providing concrete examples that teams could learn from and build upon.

