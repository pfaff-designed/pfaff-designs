project_facts: |
  Client: Coca-Cola
  Project: Hydration-Aware Vending Exploration
  Role: Creative Technologist / Applied AI Researcher
  Summary: Charles explored and prototyped a hydration-aware vending concept using research, simulated data modeling, and system-interpretation logic. He built a working prototype that demonstrated how hydration readings could responsibly translate into product recommendations.
  Team: Innovation strategists, product designers, technical directors

context: |
  Coca-Cola wanted to understand whether a vending machine could identify a simple hydration signal and offer an appropriate product recommendation before a person felt noticeably dehydrated. The challenge involved grounding the concept in real scientific behavior while acknowledging hardware limitations.

problem: |
  Hydration is difficult to measure outside clinical environments. The team needed clarity on which signals were realistic, how reliable they might be, and whether a consumer-friendly experience could be responsibly designed around them. Without real sensors, evaluating the concept required a believable data model and interpretation logic.

solution: |
  Charles developed a simplified but science-informed hydration classification model, built simulated datasets that reflected natural variation, and designed interpretation rules mapping hydration levels to Coca-Cola's product categories. He then built an interactive prototype that let stakeholders experience the idea as a functioning flow rather than an abstract concept.

process: |
  - Researched how dehydration is measured and classified across clinical and consumer contexts.
  - Identified feasible sensing methods, excluding solutions unrealistic for consumer hardware.
  - Created simulated hydration data representing mild, moderate, and more significant dehydration levels, including natural noise.
  - Designed interpretation logic that emphasized responsible recommendations and conservative thresholds.
  - Built an interactive prototype demonstrating end-to-end system behavior, pacing, tone, and edge cases.
  - Explored a far-future "Freestyle-like" machine vision for real-time nutrient/electrolyte mixing.

impact: |
  The exploration clarified the feasibility of a hydration-aware vending experience.
  The prototype gave leadership a concrete way to evaluate the idea, revealing which UX patterns felt intuitive and which scientific assumptions needed refinement.
  It also provided a flexible technical model the team could evolve as sensor opportunities matured.

reflections: |
  Charles strengthened his ability to combine research, feasibility modeling, AI reasoning, and prototyping into an experience that supports decision-making in ambiguous problem spaces. The work balanced scientific grounding with creative possibility, helping envision both near-term and long-term future states.

