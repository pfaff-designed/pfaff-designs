project:
  id: "coca-cola-creative-technology"
  title: "Coca-Cola Creative Technology Prototyping"
  client: "Coca-Cola"
  industry: "Brand, Creative Technology, Innovation"
  role: "Creative Technologist / Front-End Engineer"
  one_liner: "Prototyped AI-powered retail experiences for Coca-Cola, including a hydration-aware vending concept that recommends drinks."

context: |
  Coca-Cola was exploring how AI could shape future retail and experiential touchpoints. The team wanted to understand what an intelligent, personalized brand interaction might look like—from vending machines to product discovery moments.

  Through AKQA, I worked as a creative technologist supporting designers, art directors, and creative leadership. My role was to translate early creative concepts into functional prototypes that made ambitious ideas tangible enough to evaluate.

  One of the key explorations was an AI‑enabled vending machine concept that analyzed a person’s hydration indicators and recommended products accordingly. Although experimental, it gave the team a concrete way to explore how AI‑driven personalization could enhance everyday brand interactions.

problem: |
  Coca-Cola needed a way to evaluate AI‑driven brand experiences quickly, without committing to full-scale production. They were looking for working prototypes that demonstrated how AI could personalize interactions, recommend products, or adapt in real time based on user input.

solution: |
  I built front-end prototypes that connected to simple AI classification and recommendation logic, allowing the team to simulate different interaction flows and evaluate how AI might support the brand experience.

  Working closely with designers and art directors, I translated creative concepts into interactive UI elements that were clear, expressive, and flexible enough to iterate on rapidly during the exploration phase.

process: |
  I partnered with the creative team to outline the intended user journey and understand which AI signals and outputs the concept required. From there, I developed interactive prototypes that simulated hydration detection, product recommendations, and adaptive UI states.

  These prototypes evolved quickly as creative leadership refined the direction. I adjusted the UI, updated interactions, and ensured everything aligned with Coca-Cola’s visual and tonal direction. Because this was a rapid innovation sprint, the work required flexible thinking, fast iteration, and close collaboration across disciplines.

outcomes: |
  The prototypes helped Coca-Cola understand how AI could enrich everyday brand interactions. They turned abstract ideas into concrete experiences that leadership could react to, evaluate, and build from.

  The work provided a starting point for exploring AI-assisted product selection, personalized recommendations, and adaptive retail environments.

reflections: |
  This project reinforced how valuable creative technology is during early exploration. I enjoyed working tightly with designers and creative directors to turn imaginative ideas into something people could interact with.

  It strengthened my ability to build fast, expressive prototypes and deepened my appreciation for how AI can support meaningful, human-centered brand experiences.

