project_facts: |
  Client: Tanger
  Project: Tanger Digital Experience Refresh
  Role: Front-End Engineer
  Summary: Charles contributed to Tanger's digital refresh by building fast, accessible UI components that supported a modernized shopping and discovery experience across Tanger locations.
  Team: Product managers, UX designers, front-end and platform engineers

context: |
  Tanger wanted to evolve their digital experience to feel more modern, responsive, and aligned with their updated brand direction. The team needed flexible components that supported location discovery, offers, events, and tenant information—while ensuring consistent performance across devices.

problem: |
  The legacy UI was rigid, inconsistent, and difficult to scale. Different Tanger locations needed localized content, but the system lacked components flexible enough to support that variation without duplicating UI logic.

solution: |
  Charles developed modular UI components in React + TypeScript that supported dynamic content modules, improved layout consistency, and increased performance across breakpoints. His work emphasized accessibility, responsiveness, and ease of integration with Tanger's backend systems.

process: |
  - Translated updated design direction into reusable UI patterns.
  - Built location-aware modules that allowed each Tanger center to present offers, events, and store information consistently.
  - Improved performance through careful component optimization and reduced layout thrashing.
  - Enhanced accessibility through semantic markup and keyboard interaction support.
  - Closely collaborated with design and backend teams to validate content flows and handle edge cases.

impact: |
  The refreshed component library improved consistency across Tanger's digital ecosystem and reduced engineering overhead for location-specific pages. The result was a cleaner, more engaging experience that supported both brand expression and functional discovery.

reflections: |
  Charles appreciated the challenge of building flexible components that worked across many types of content while staying true to Tanger's evolving brand language. The project strengthened his skills in performance-minded UI engineering and cross-team collaboration.

