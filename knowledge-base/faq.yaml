  - id: preferred_stack
    category: tools
    question: "What is your preferred stack for building intelligent interfaces?"
    alias_questions:
      - "What stack do you like for AI powered web apps?"
    short_answer: >
      I like a React and TypeScript front end with Next.js, Tailwind, Supabase, and a RAG pipeline orchestrated through a tracing tool like LangSmith.
    long_answer: >
      For intelligent interfaces I prefer a React and TypeScript front end with Next.js and Tailwind, backed by Supabase or a similar platform.
      I design RAG pipelines using vector storage, good chunking and metadata, and an orchestration layer that I can trace and debug in LangSmith.
      On top of that I add deterministic UI components so AI outputs map cleanly to layouts.

  - id: rag_definition
    category: ai
    question: "What is a RAG pipeline?"
    alias_questions:
      - "What does RAG mean?"
      - "How do you define RAG?"
    short_answer: >
      RAG stands for retrieval augmented generation, which means combining search over your own data with a language model so answers are grounded in real sources.
    long_answer: >
      RAG stands for retrieval augmented generation. In a RAG pipeline, a user question is first turned into a retrieval query against a knowledge base,
      using embeddings and sometimes lexical search to find relevant chunks of content. Those retrieved snippets are then passed to a language model
      with clear instructions to answer using only that context. This gives you more accurate, controllable answers that are grounded in your own data,
      instead of relying on the model to guess.

  - id: how_you_think_about_rag
    category: ai
    question: "How do you think about RAG in your work?"
    alias_questions:
      - "What is your approach to RAG?"
      - "How do you design RAG systems?"
    short_answer: >
      I treat RAG as a system design problem, not a single model call, and focus on retrieval quality, grounding, and clear UI behavior.
    long_answer: >
      I treat RAG as a system design problem. Retrieval quality, chunking, and metadata matter as much as prompt wording.
      I care about hybrid or well tuned retrieval, clear instructions that force the model to use only provided context,
      and UI patterns that show what sources were used. I design pipelines that are traceable, testable, and predictable
      so teams can understand and trust what the system is doing.

  - id: how_you_think_about_ai
    category: ai
    question: "How do you think about AI in products?"
    alias_questions:
      - "What is your philosophy on AI?"
      - "How should AI show up in interfaces?"
    short_answer: >
      I think AI should feel like a helpful collaborator that understands context and reduces friction rather than a gimmick.
    long_answer: >
      I think AI should feel like a helpful collaborator. It should understand context, reduce friction, and make it easier for people
      to reach their goals. I try to avoid AI features that feel like a gimmick. Instead I design intelligent systems that are predictable,
      transparent about where information comes from, and grounded in real user needs.

