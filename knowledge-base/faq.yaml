  - id: process_how_you_work
    category: process
    question: "What is your process for designing and building a system?"
    alias_questions:
      - "How do you work?"
      - "What is your typical approach to a project?"
    short_answer: >
      I start by clarifying intent and constraints, then design the system and flows, then build simple foundations that can scale.
    long_answer: >
      I start by understanding the intent and constraints, often through research, writing, and defining a clear north star for the project.
      From there I sketch user journeys, flows, and system boundaries, and map them into components and pipelines.
      I look for existing patterns to reuse, then build simple but scalable foundations, test early, and iterate with the team.

  - id: debugging_style
    category: process
    question: "How do you approach debugging?"
    alias_questions:
      - "How do you fix issues in code?"
    short_answer: >
      I try to isolate the real issue, simplify the problem, and debug methodically using logs and controlled tests.
    long_answer: >
      When debugging I look for the root issue instead of only treating symptoms. I reduce the problem to the smallest reproducible case,
      use logging and tools to see what is actually happening, and then change only one thing at a time.
      I rely on clear structure and tests to make it easier to understand what went wrong and how to fix it.

  - id: testing_practices
    category: process
    question: "How do you think about testing?"
    alias_questions:
      - "Do you write tests?"
      - "What is your approach to quality?"
    short_answer: >
      I try to include testing as part of the foundation, not an afterthought, and I use tools like Jest and Storybook.
    long_answer: >
      I try to include testing as part of the foundation of a project. That means using tools like Jest for behavior and Storybook
      for visual and interaction testing where it makes sense. If the system is well structured, tests are easier to write and maintain,
      and they make debugging and refactoring safer.

