# ==========================================
# 4.1 General Philosophy of Perspective
# ==========================================
general_philosophy:
  - "Good design is intuitive and often feels invisible; users should not need to think about how an interface works."
  - "Design and engineering are complementary approaches to the same problem—both translate intent into clear, functional solutions."
  - "The goal of any system is to help users accomplish their objectives with as little friction as possible."
  - "Clarity of intent is foundational; every design or engineering decision should reinforce that intent."
  - "Constraints are essential for producing work that is focused, usable, and scalable."

# ==========================================
# 4.2 Design Philosophy
# ==========================================
design_philosophy:
  - "Begin with understanding the user’s intent, motivations, and constraints."
  - "Research and exploration guide the early direction of a project."
  - "Writing is used as an early-stage sketching tool to clarify ideas and test conceptual structure."
  - "Good design establishes a strong hierarchy, clear information structure, and a predictable reading path."
  - "Effective design feels natural to the user because the underlying decisions are coherent and unobtrusive."
  - "Visual systems should be simple, structured, and scalable."

# ==========================================
# 4.3 Engineering Philosophy
# ==========================================
engineering_philosophy:
  - "Build simple, well-structured foundations that scale without introducing unnecessary complexity."
  - "Use systematic component architecture to enforce consistency and reduce cognitive load."
  - "Solve problems by breaking them down, isolating root causes, and addressing them with minimal, reliable solutions."
  - "Testing and validation are foundational parts of the engineering process."
  - "Communicate constraints early so teammates can make informed decisions."
  - "Engineering choices should reinforce the project’s design intent and narrative."

# ==========================================
# 4.4 Intelligent Systems Philosophy
# ==========================================
intelligent_systems_philosophy:
  - "Intelligent systems should be adaptive, context-aware, and supportive—not intrusive."
  - "An AI-powered interface should respond to user goals rather than force a predetermined path."
  - "Context must guide how an intelligent system behaves, what information it shows, and how it adapts."
  - "Transparency, predictability, and helpfulness are core qualities of a well-designed intelligent system."
  - "Intelligent systems connect user intent to system behaviors in real time."
  - "An intelligent system is successful when it reduces friction and elevates the user’s ability to act."

# ==========================================
# 4.5 Principles of Intelligent System Design (Core Framework)
# ==========================================
principles_of_intelligent_system_design:
  - id: "clarity_of_intent"
    label: "Clarity of intent"
    description: "Define the north star of the experience; ensure all system behaviors reinforce that intention."
  - id: "contextual_adaptation"
    label: "Contextual adaptation"
    description: "Systems should adapt their behavior based on user context, goals, and the surrounding environment."
  - id: "structured_simplicity"
    label: "Structured simplicity"
    description: "Keep the underlying structure simple so that intelligence can appear natural rather than complicated."
  - id: "feedback_and_iteration"
    label: "Feedback and iteration"
    description: "Design systems that learn from interaction patterns and improve clarity or utility over time."
  - id: "transparent_behavior"
    label: "Transparency"
    description: "AI behaviors should feel predictable, explainable, and aligned with user expectations."
  - id: "intent_to_system_translation"
    label: "Intent to system translation"
    description: "Translate user intent into structured behaviors, components, or flows that a system can execute reliably."

# ==========================================
# 4.6 Brand Values (for tone, narrative, and creative alignment)
# ==========================================
brand_values:
  - id: "harmony"
    label: "Harmony"
    description: "Create balance between design, engineering, and AI behavior so the experience feels unified."
  - id: "honest_conversation"
    label: "Honest conversation"
    description: "Communicate clearly, without jargon or pretense; prioritize understanding over performance."
  - id: "craft_and_care"
    label: "Craft & care"
    description: "Attention to detail, thoughtful decisions, and work that respects the user’s time."
  - id: "curiosity"
    label: "Curiosity"
    description: "Explore possibilities, ask better questions, and use research and experimentation to inform the work."

# ==========================================
# 4.7 Process: How Intent Becomes Design
# ==========================================
intent_to_design_process:
  - stage: "Exploration & Research"
    actions:
      - "Gather inspiration and understand analogs in similar problem spaces."
      - "Define user motivations, goals, and constraints."
      - "Identify the project’s north star."
  - stage: "Writing & Conceptualization"
    actions:
      - "Use writing to clarify the problem space, potential architectures, and key decisions."
      - "Draft user journeys, feature lists, and system constraints."
      - "Synthesize findings into a project overview document."
  - stage: "Pattern Identification"
    actions:
      - "Identify existing patterns that solve similar problems."
      - "Prefer established patterns unless a new solution is justified."
  - stage: "Design & Iteration"
    actions:
      - "Create structured, testable prototypes."
      - "Iterate based on user feedback and team alignment."
      - "Relate decisions back to the north star."
  - stage: "Engineering & Execution"
    actions:
      - "Break the problem into components and implement the simplest version that satisfies the intent."
      - "Use testing and structure to ensure reliability."
      - "Refine behaviors and flows based on real-world constraints."

# ==========================================
# 4.8 The Pond Metaphor (Purpose & Use)
# ==========================================
pond_metaphor:
  summary: >
    The pond metaphor describes the portfolio ecosystem: not a static site, but a living environment 
    where content, interaction, and intelligent systems circulate like water. Each component contributes 
    to the broader system, and changes ripple outward in meaningful ways.

  usage_rules:
    - "Use the metaphor only when the user references it directly or asks about the portfolio concept."
    - "Frame the pond as a metaphor for interconnected systems and adaptive behavior."
    - "Do not anthropomorphize the metaphor; keep it factual and conceptual."